id = "count-csv-rows"
title = "Count data rows in a CSV"
tags = ["read_file"]
prompt = "How many data rows (excluding the header) are in data/users.csv? Answer with the number."

[setup.files]
"data/users.csv" = """
id,name,email
1,Ada,ada@example.com
2,Linus,linus@example.com
3,Grace,grace@example.com
4,Ken,ken@example.com
5,Barbara,barbara@example.com
6,Dennis,dennis@example.com
7,Margaret,margaret@example.com
"""

[[checks]]
type = "answer_matches"
pattern = '\b7\b'
