# Local hooks so versions always match the lockfiles (uv.lock / pnpm-lock.yaml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]  # pnpm-lock.yaml is multi-document
      - id: end-of-file-fixer
        exclude: ^(packages/core/src/harness/core/protocol/_generated\.py|sdks/typescript/src/protocol\.gen\.ts)$
      - id: trailing-whitespace
        exclude: ^(packages/core/src/harness/core/protocol/_generated\.py|sdks/typescript/src/protocol\.gen\.ts)$
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: biome
        name: biome check
        entry: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [ts, javascript, json]
      - id: lint-deps
        name: dependency rules
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
