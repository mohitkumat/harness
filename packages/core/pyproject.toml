[project]
name = "harness-core"
version = "0.0.0"
description = "Canonical types, agent loop, event bus and errors. Imports nothing from this repo."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",  # canonical + protocol models (CLAUDE.md §7)
]

[tool.uv.build-backend]
module-name = "harness.core"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
