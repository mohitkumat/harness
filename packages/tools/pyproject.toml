[project]
name = "harness-tools"
version = "0.0.0"
description = "Tool registry, built-in tools and MCP client."
requires-python = ">=3.12"
dependencies = [
    "harness-core",
    "jsonschema>=4.23",  # validates tool arguments against each tool's JSON schema
]

[tool.uv.sources]
harness-core = { workspace = true }

[tool.uv.build-backend]
module-name = "harness.tools"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
