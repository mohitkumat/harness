[project]
name = "harness-context"
version = "0.0.0"
description = "Context manager: budgeted per-call views of history, compaction, token budgeting."
requires-python = ">=3.12"
dependencies = ["harness-core"]

[tool.uv.sources]
harness-core = { workspace = true }

[tool.uv.build-backend]
module-name = "harness.context"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
