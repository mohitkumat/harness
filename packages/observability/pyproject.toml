[project]
name = "harness-observability"
version = "0.0.0"
description = "OpenTelemetry tracing and cost tracking."
requires-python = ">=3.12"
dependencies = ["harness-core"]

[tool.uv.sources]
harness-core = { workspace = true }

[tool.uv.build-backend]
module-name = "harness.observability"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
