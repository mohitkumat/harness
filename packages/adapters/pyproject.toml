[project]
name = "harness-adapters"
version = "0.0.0"
description = "Model adapters: translate canonical types to/from each provider. The ONLY place provider-specific code may live."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "harness-core",
    "openai>=3.35.1",  # Chat Completions SDK for OpenAI-compatible servers (Ollama, vLLM); httpx2-based, so cassettes work
]

[tool.uv.sources]
harness-core = { workspace = true }

[tool.uv.build-backend]
module-name = "harness.adapters"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
