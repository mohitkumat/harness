[project]
name = "harness-memory"
version = "0.0.0"
description = "Session store and long-term memory."
requires-python = ">=3.12"
dependencies = ["harness-core"]

[tool.uv.sources]
harness-core = { workspace = true }

[tool.uv.build-backend]
module-name = "harness.memory"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
