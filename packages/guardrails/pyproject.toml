[project]
name = "harness-guardrails"
version = "0.0.0"
description = "Permission policies, limits and untrusted-content tagging."
requires-python = ">=3.12"
dependencies = ["harness-core"]

[tool.uv.sources]
harness-core = { workspace = true }

[tool.uv.build-backend]
module-name = "harness.guardrails"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
