# Virtual workspace root: not a package itself; installs every member + dev tools.
[project]
name = "agent-harness"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "harness-core",
    "harness-adapters",
    "harness-tools",
    "harness-context",
    "harness-memory",
    "harness-sandbox",
    "harness-guardrails",
    "harness-observability",
    "harness-evals",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "evals/runner"]

[tool.uv.sources]
harness-core = { workspace = true }
harness-adapters = { workspace = true }
harness-tools = { workspace = true }
harness-context = { workspace = true }
harness-memory = { workspace = true }
harness-sandbox = { workspace = true }
harness-guardrails = { workspace = true }
harness-observability = { workspace = true }
harness-evals = { workspace = true }

[dependency-groups]
dev = [
    "ruff",                       # lint + format
    "pyright",                    # strict type checking
    "pytest",                     # test runner
    "pytest-asyncio",             # async tests
    "import-linter",              # enforces package dependency rules (just lint-deps)
    "datamodel-code-generator",   # protocol/ JSON Schema -> Pydantic codegen (just gen)
    "jsonschema",                 # validates protocol examples against the schema in tests
    "types-jsonschema",           # type stubs for the above (pyright strict)
    "pre-commit",                 # git hooks
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/core/src/harness/core/protocol/_generated.py"]
force-exclude = true  # honour excludes even when pre-commit passes file names

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TID", "D"]
ignore = [
    "D100", "D104", "D105", "D107",  # module/package/magic/__init__ docstrings
    "D203", "D213",                  # conflicting docstring styles
    "E501",                          # ruff format owns line length; long prose lines are fine
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["harness", "harness_evals"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages", "evals/runner"]
exclude = ["**/node_modules", "**/.venv"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "evals/runner/tests"]
addopts = "--import-mode=importlib -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ---------------------------------------------------------------- codegen (just gen)
[tool.datamodel-codegen]
input = "protocol/protocol.schema.json"
input-file-type = "jsonschema"
output = "packages/core/src/harness/core/protocol/_generated.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-annotated = true
use-standard-collections = true
use-union-operator = true
field-constraints = true
use-schema-description = true
use-field-description = true
use-double-quotes = true
disable-timestamp = true
enum-field-as-literal = "all"
strict-nullable = true
use-title-as-name = true
custom-file-header = "# GENERATED by `just gen` from protocol/protocol.schema.json — DO NOT EDIT."
formatters = ["ruff-format"]

# ---------------------------------------------------------------- dependency rules (just lint-deps)
[tool.importlinter]
root_packages = ["harness", "harness_evals"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports nothing from this repo"
type = "forbidden"
source_modules = ["harness.core"]
forbidden_modules = [
    "harness.adapters", "harness.tools", "harness.context", "harness.memory",
    "harness.sandbox", "harness.guardrails", "harness.observability", "harness_evals",
]

[[tool.importlinter.contracts]]
name = "packages may import core only (not each other)"
type = "independence"
modules = [
    "harness.adapters", "harness.tools", "harness.context", "harness.memory",
    "harness.sandbox", "harness.guardrails", "harness.observability",
]

[[tool.importlinter.contracts]]
name = "packages never import apps or evals"
type = "forbidden"
source_modules = [
    "harness.core", "harness.adapters", "harness.tools", "harness.context", "harness.memory",
    "harness.sandbox", "harness.guardrails", "harness.observability",
]
forbidden_modules = ["harness_evals"]

[[tool.importlinter.contracts]]
name = "provider SDKs only inside adapters (prime directive)"
type = "forbidden"
source_modules = [
    "harness.core", "harness.tools", "harness.context", "harness.memory",
    "harness.sandbox", "harness.guardrails", "harness.observability", "harness_evals",
]
# `google` rather than `google.genai`: import-linter cannot target subpackages of external packages.
forbidden_modules = ["anthropic", "openai", "google", "ollama"]
allow_indirect_imports = true
